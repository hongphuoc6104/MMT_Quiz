name: Generate question crop images

on:
  push:
    paths:
      - 'scripts/generate_question_crops.py'
      - '.github/workflows/generate-question-crops.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python scripts/generate_question_crops.py
      - name: Commit generated crop images
        run: |
          if [ -z "$(git status --porcelain -- assets/crops question_crop_report.json question_crop_report.txt)" ]; then
            echo 'No crop changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/crops question_crop_report.json question_crop_report.txt
          git commit -m 'generate dedicated question crops'
          git pull --rebase origin main
          git push origin HEAD:main
