name: Audit Vietnamese question text

on:
  push:
    paths:
      - 'questions.js'
      - 'question_structure_fixes.js'
      - 'data_corrections.js'
      - 'pdf_ocr_hotfixes.js'
      - 'scripts/audit_vietnamese_text.js'
      - '.github/workflows/audit-vietnamese-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit all 314 questions
        run: node scripts/audit_vietnamese_text.js
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vietnamese_text_audit.json vietnamese_text_audit.txt
          if git diff --cached --quiet; then
            echo 'Audit report unchanged.'
            exit 0
          fi
          git commit -m 'update Vietnamese text audit report'
          git pull --rebase origin main
          git push origin HEAD:main
