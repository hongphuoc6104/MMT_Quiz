name: Validate question and theory consistency

on:
  push:
    paths:
      - 'questions.js'
      - 'question_structure_fixes.js'
      - 'data_corrections.js'
      - 'question_consistency_fixes.js'
      - 'solution_consistency_fixes.js'
      - 'pdf_ocr_hotfixes.js'
      - 'vietnamese_text_cleanup_20260809.js'
      - 'vietnamese_text_cleanup_final_20260809.js'
      - 'source_preserving_ocr_fixes_20260809.js'
      - 'data/question_sources.json'
      - 'manual_solutions/**'
      - 'beginner_theory.js'
      - 'theory_topic_guard.js'
      - 'manual_bootstrap.js'
      - 'scripts/validate-question-solution-consistency.cjs'
      - 'scripts/validate-manual-solutions.cjs'
      - '.github/workflows/validate-question-consistency.yml'
  pull_request:
    paths:
      - 'questions.js'
      - 'question_structure_fixes.js'
      - 'data_corrections.js'
      - 'question_consistency_fixes.js'
      - 'solution_consistency_fixes.js'
      - 'pdf_ocr_hotfixes.js'
      - 'vietnamese_text_cleanup_20260809.js'
      - 'vietnamese_text_cleanup_final_20260809.js'
      - 'source_preserving_ocr_fixes_20260809.js'
      - 'data/question_sources.json'
      - 'manual_solutions/**'
      - 'beginner_theory.js'
      - 'theory_topic_guard.js'
      - 'manual_bootstrap.js'
      - 'scripts/validate-question-solution-consistency.cjs'
      - 'scripts/validate-manual-solutions.cjs'
      - '.github/workflows/validate-question-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate all manual solutions
        run: node scripts/validate-manual-solutions.cjs all
      - name: Validate question/options, PDF source alignment and theory topic isolation
        run: node scripts/validate-question-solution-consistency.cjs
      - name: Verify runtime wiring and syntax
        run: |
          grep -q "'solution_consistency_fixes.js" manual_bootstrap.js
          grep -q "'question_consistency_fixes.js" manual_bootstrap.js
          grep -q "'theory_topic_guard.js" manual_bootstrap.js
          grep -q "'source_preserving_ocr_fixes_20260809.js" manual_bootstrap.js
          node -e "JSON.parse(require('fs').readFileSync('data/question_sources.json','utf8'))"
          node --check solution_consistency_fixes.js
          node --check question_consistency_fixes.js
          node --check theory_topic_guard.js
          node --check source_preserving_ocr_fixes_20260809.js
