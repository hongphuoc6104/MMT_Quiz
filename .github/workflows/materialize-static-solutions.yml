name: Validate committed static quiz solutions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate committed static solutions only
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const questions=JSON.parse(fs.readFileSync('questions.json','utf8'));
          const s={window:{}};vm.createContext(s);vm.runInContext(fs.readFileSync('static_solutions.js','utf8'),s);
          const d=s.window.STATIC_SOLUTION_DATA;
          if(!d) throw new Error('static_solutions.js is missing/invalid');
          if(d.metadata.question_count!==questions.metadata.question_count) throw new Error('Question count mismatch');
          if(Object.keys(d.solutions).length!==questions.questions.length) throw new Error('Static solution map is incomplete');
          for(const q of questions.questions){
            const sol=d.solutions[q.id];
            if(!sol) throw new Error('Missing static solution: '+q.id);
            if(!Array.isArray(sol.options)||sol.options.length!==q.options.length) throw new Error('Incomplete option analysis: '+q.id);
          }
          console.log('Validated static-only solutions:',questions.questions.length);
          NODE
