name: Validate quiz content

on:
  push:
    branches: [main]
    paths:
      - 'questions.json'
      - 'questions.js'
      - 'manual_solutions/**'
      - 'data_corrections.js'
      - 'manual_to_static.js'
      - 'manual_bootstrap.js'
      - 'learning_view.js'
      - 'learning_view.css'
      - 'app.js'
      - 'index.html'
      - 'scripts/validate-manual-solutions.cjs'
      - '.github/workflows/validate-manual-solutions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check 314 manual solutions and sections
        run: node scripts/validate-manual-solutions.cjs all

      - name: Cross-check the exact data used by the website
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const files=[
            'manual_solutions/de01_a.js','manual_solutions/de01_b.js','manual_solutions/de01_ver2.js',
            'manual_solutions/de02_a.js','manual_solutions/de02_b.js','manual_solutions/de03_a.js','manual_solutions/de03_b.js',
            'manual_solutions/de04_ch1_a.js','manual_solutions/de04_ch1_b.js','manual_solutions/de04_ch1_c.js',
            'manual_solutions/de04_ch3_a.js','manual_solutions/de04_ch3_b.js','manual_solutions/de04_ch4.js',
            'manual_solutions/de04_ch5_a.js','manual_solutions/de04_ch5_b.js','manual_solutions/de04_ch6_a.js','manual_solutions/de04_ch6_b.js',
            'manual_solutions/de04_ch7_a.js','manual_solutions/de04_ch7_b.js','manual_solutions/de04_ch8_a.js','manual_solutions/de04_ch8_b.js',
            'manual_solutions/de07.js','manual_solutions/de08.js'
          ];
          const box={window:{},console}; vm.createContext(box);
          vm.runInContext(fs.readFileSync('questions.js','utf8'),box,{filename:'questions.js'});
          for(const f of files)vm.runInContext(fs.readFileSync(f,'utf8'),box,{filename:f});
          vm.runInContext(fs.readFileSync('data_corrections.js','utf8'),box,{filename:'data_corrections.js'});
          vm.runInContext(fs.readFileSync('manual_to_static.js','utf8'),box,{filename:'manual_to_static.js'});
          const data=box.window.QUIZ_DATA;
          const live=box.window.STATIC_SOLUTION_DATA;
          if(!data||!live?.solutions)throw new Error('Live quiz data failed to initialize');
          if(data.questions.length!==314||Object.keys(live.solutions).length!==314)throw new Error('Live quiz is not 314/314');
          for(const q of data.questions){
            const ids=(q.options||[]).map(o=>o.id);
            if(new Set(ids).size!==ids.length)throw new Error(`Duplicate option ID in question ${q.id}`);
            if(!ids.includes(q.correct_option_id))throw new Error(`Correct option missing in question ${q.id}/${q.correct_option_id}`);
            const sol=live.solutions[q.id];
            if(!sol||sol.options.length!==q.options.length)throw new Error(`Live option analysis mismatch: ${q.id}`);
            const marked=[...new Set(sol.options.filter(o=>o.correct).map(o=>o.id))];
            if(marked.length!==1||marked[0]!==q.correct_option_id)throw new Error(`Live answer mismatch ${q.id}: question=${q.correct_option_id}, live=${marked.join(',')}`);
            for(const o of sol.options){
              if(!String(o.why||'').trim()||!String(o.when||'').trim())throw new Error(`Incomplete live explanation: ${q.id}/${o.id}`);
            }
            if(!String(sol.reasoning||'').trim()||!String(sol.summary||'').trim())throw new Error(`Missing live reasoning/summary: ${q.id}`);
          }
          console.log('live answer cross-check ok: 314/314');
          NODE

      - name: Check presentation JavaScript syntax
        run: |
          node --check manual_to_static.js
          node --check manual_bootstrap.js
          node --check learning_view.js

      - name: Verify current website wiring
        run: |
          grep -q 'questions.js' index.html
          grep -q 'manual_bootstrap.js' index.html
          grep -q 'manual_solutions/de01_a.js' manual_bootstrap.js
          grep -q 'manual_solutions/de08.js' manual_bootstrap.js
          grep -q 'manual_to_static.js' manual_bootstrap.js
          grep -q 'data_corrections.js' manual_bootstrap.js
          grep -q 'app.js' manual_bootstrap.js
          grep -q 'learning_view.js' manual_bootstrap.js
          if grep -q 'static_solutions.js\|solution_engine.js\|scripts/materialize-solutions' index.html; then
            echo 'index.html still references disabled or stale generated solution machinery'
            exit 1
          fi
          echo 'website wiring ok'
