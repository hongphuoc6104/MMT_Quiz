name: Analyze source images

on:
  push:
    paths:
      - 'scripts/analyze_source_images.py'
      - '.github/workflows/analyze-source-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python scripts/analyze_source_images.py
      - name: Commit analysis
        run: |
          if [ -z "$(git status --porcelain -- source_image_analysis.json source_image_analysis.txt)" ]; then
            echo 'No analysis changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source_image_analysis.json source_image_analysis.txt
          git commit -m 'analyze source image regions'
          git push
